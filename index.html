<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thali</title>
  <meta name="description" content="A simple calorie and macro log for Indian home cooking.">
  <meta name="theme-color" content="#EEF2EF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101714" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Thali">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="preload" href="fonts/lexend-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/lexend-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="view" tabindex="-1">
    <section class="screen"><p class="lede">Loading…</p></section>
  </main>

  <nav id="tabs" aria-label="Main">
    <button data-tab="today"><span class="tab-ic"><svg class="icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/></svg></span><span>Today</span></button>
    <button data-tab="add"><span class="tab-ic"><svg class="icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></span><span>Add</span></button>
    <button data-tab="saved"><span class="tab-ic"><svg class="icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4.5L5 21V4.5a1 1 0 0 1 1-1z"/></svg></span><span>Saved</span></button>
    <button data-tab="history"><span class="tab-ic"><svg class="icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span><span>History</span></button>
    <button data-tab="settings"><span class="tab-ic"><svg class="icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></span><span>Settings</span></button>
  </nav>

  <div id="busy" hidden></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="modal" hidden></div>

  <!-- Hidden pickers. "capture" opens the camera straight away on iPhone. -->
  <input id="in-camera" class="hidden-input" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
  <input id="in-library" class="hidden-input" type="file" accept="image/*" tabindex="-1" aria-hidden="true">
  <input id="in-barcode" class="hidden-input" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
  <input id="in-label" class="hidden-input" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
  <input id="in-import" class="hidden-input" type="file" accept="application/json,.json" tabindex="-1" aria-hidden="true">

  <noscript><p style="padding:24px">Thali needs JavaScript turned on.</p></noscript>

  <script src="vendor/barcode-detector.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
